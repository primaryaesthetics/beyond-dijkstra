[package]
name = "beyond_dijkstra"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
authors = ["Nikolai Khobotov <nicholaask@gmail.com>"]
description = "Single-source shortest paths: production Dijkstra plus the first implementation of the Duan-Mao-Shu-Yin O(m sqrt(log n log log n)) directed SSSP algorithm (arXiv:2602.07868)"
license = "MIT"
repository = "https://github.com/primaryaesthetics/beyond-dijkstra"

[features]
default = []
# Wall-clock phase attribution inside the solver (degree reduction,
# FindPivots, partition, base case, DS operations, relax sweeps). Zero
# overhead when off; results are unchanged when on. Used by
# `examples/profile_phases.rs`.
phase-timer = []
# Q11 event trace: record every event touching one chosen vertex (relax
# acceptances, D inserts, pulls, settlements, K/W membership) with a
# call-path snapshot. Zero overhead when off; results are unchanged when
# on. Used by `examples/q11_trace.rs`.
q11-trace = []
# Contract verification: count per-return violations of Lemma 3.7's
# bound clause (dB[D] >= B', stored values) and of Lemma 3.1's
# full-execution dichotomy, at base-case and recursive returns
# separately (QUESTIONS.md Q3, Q10, Q12). Pure observation - results
# are unchanged when on; zero overhead when off. Used by
# `examples/verify_contract.rs`.
verify-contract = []

[dependencies]
# Deterministic fast hashing for bookkeeping maps/sets. Iteration order of
# these containers is never observed (membership/get/remove only; the one
# hash-map iteration, BlockDs::merge, feeds a commutative keep-min insert),
# so the hasher cannot change results — enforced by the differential gate.
rustc-hash = "2"
# Global allocator. The BMSSP recursion makes millions of small,
# short-lived Vec/map allocations per run; mimalloc handles that pattern
# far better than system heaps. Allocator choice cannot affect results
# (differential gate re-verified after the swap - OPTIMIZATION.md pass 2).
mimalloc = { version = "0.1", default-features = false }

[[example]]
name = "q11_trace"
required-features = ["q11-trace"]

[[example]]
name = "verify_contract"
required-features = ["verify-contract"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1

# The differential / property tests run the recursion on graphs with up to
# ~1.5e4 edges before reduction; unoptimized debug builds make that
# needlessly slow. Keep debug assertions on but optimize.
[profile.test]
opt-level = 2

[profile.dev]
opt-level = 2
